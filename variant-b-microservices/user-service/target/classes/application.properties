spring.application.name=user-service
server.port=8081

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5433/user_service
spring.datasource.username=user_service
spring.datasource.password=user_service
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.serialization.write-bigdecimal-as-plain=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Configuration sensitivity experiment: HikariCP pool at 30 (default is 10)
spring.datasource.hikari.maximum-pool-size=30