spring.application.name=product-service
server.port=8082

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5434/product_service
spring.datasource.username=product_service
spring.datasource.password=product_service
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.serialization.write-bigdecimal-as-plain=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus