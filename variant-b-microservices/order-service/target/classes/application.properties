spring.application.name=order-service
server.port=8083

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5435/order_service
spring.datasource.username=order_service
spring.datasource.password=order_service
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.serialization.write-bigdecimal-as-plain=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# URLs of other services
services.user-service.url=http://localhost:8081
services.product-service.url=http://localhost:8082

# Configuration sensitivity experiment: HikariCP pool at 30 (default is 10)
spring.datasource.hikari.maximum-pool-size=30