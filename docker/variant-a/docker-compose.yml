services:
  postgres:
    image: postgres:16-alpine
    container_name: monolith-postgres
    environment:
      POSTGRES_DB: monolith
      POSTGRES_USER: monolith
      POSTGRES_PASSWORD: monolith
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: