spring.application.name=monolith
  
  # Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/monolith
spring.datasource.username=monolith
spring.datasource.password=monolith
spring.datasource.driver-class-name=org.postgresql.Driver
  
  # JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
  
  # Jackson - serialise BigDecimal as numbers, not strings
spring.jackson.serialization.write-bigdecimal-as-plain=true
  
  # Actuator - expose health, metrics, prometheus endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus